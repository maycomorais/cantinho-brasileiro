<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imprimir Comanda - Cantinho Brasileiro</title>
    <style>
    /* ────────────────────────────────────────────
       CONFIGURAÇÃO GERAL (TELA E IMPRESSÃO)
    ──────────────────────────────────────────── */
    body {
        font-family: Arial, Helvetica, sans-serif; /* Fonte sem serifa */
        background: #d0d0d0;
        padding: 10px;
        margin: 0;
    }

    .ticket {
        background: #fff;
        max-width: 320px; /* Largura padrão para 58mm */
        margin: 0 auto;
        padding: 8px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    h3 { text-align: center; font-size: 20px; margin-bottom: 2px; }
    .centered { text-align: center; font-size: 14px; margin-bottom: 2px; }
    .num-pedido { font-weight: bold; font-size: 22px; border: 1px solid #000; display: block; margin: 4px 0; }
    .tipo-entrega-tx { font-weight: bold; font-size: 18px; text-align: center; margin: 4px 0; }

    hr { border: none; border-top: 1px dashed #000; margin: 5px 0; }

    .info-group { font-size: 14px; line-height: 1.3; margin-bottom: 4px; }
    .info-group strong { font-weight: bold; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; border-bottom: 1px solid #000; font-size: 13px; padding-bottom: 2px; }
    
    /* Itens: Fonte Grande e Legível */
    td { vertical-align: top; padding: 3px 0; font-size: 16px; font-weight: bold; line-height: 1.2; }
    .detalhes-item { font-size: 16px; font-weight: normal; display: block; } /* Mesmo tamanho do item */

    /* Detalhes do item (sabores, montagem, obs) */
    .detalhe-variacao  { font-size: 13px; color: #555; font-weight: normal; }
    .detalhe-preparo   { font-size: 13px; color: #2980b9; font-weight: normal; }
    .detalhe-montagem  { font-size: 15px; font-weight: normal; color: #222; }
    .detalhe-obs       { font-size: 13px; font-weight: bold; color: #c0392b; }

    .totals { text-align: right; font-size: 15px; margin-top: 5px; line-height: 1.4; }
    .total-final { font-size: 24px; font-weight: bold; border-top: 1px solid #000; margin-top: 4px; padding-top: 2px; }

    .rodape { text-align: center; font-size: 12px; margin-top: 8px; }
    .btn-print {
        display: block; width: 100%; padding: 15px; background: #1a7a2e; color: white; 
        border: none; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; border-radius: 8px;
    }

    /* ────────────────────────────────────────────
       IMPRESSÃO (TÉRMICA)
    ──────────────────────────────────────────── */
    @media print {
        @page { margin: 0; size: 58mm auto; }
        body { background: none; padding: 0; margin: 0; width: 58mm; }
        .btn-print { display: none; }

        /* Ticket mais compacto */
        .ticket { box-shadow: none; width: 100%; padding: 3px 4px; margin: 0; }

        /* Cabeçalho — menor, ainda legível */
        h3 { font-size: 16px; margin-bottom: 1px; }
        .centered { font-size: 11px; margin-bottom: 1px; }
        .num-pedido { font-size: 20px; margin: 2px 0; }
        .tipo-entrega-tx { font-size: 14px; margin: 2px 0; }

        /* Informações do cliente — compactas */
        .info-group { font-size: 11px; line-height: 1.2; margin-bottom: 2px; }

        /* Separadores mais finos e sem espaço */
        hr { border-top: 1px dashed #000; margin: 3px 0; }

        /* Itens — fonte legível, sem exagero */
        th { font-size: 11px; padding-bottom: 1px; }
        td { font-size: 13px; padding: 2px 0; line-height: 1.15; }
        .detalhes-item { font-size: 11px; }

        /* Detalhes do item na impressão */
        .detalhe-variacao  { font-size: 11px; }
        .detalhe-preparo   { font-size: 11px; }
        .detalhe-montagem  { font-size: 13px; } /* mesmo tamanho do nome do item */
        .detalhe-obs       { font-size: 11px; }

        /* Total em destaque, mas menor que antes */
        .totals { font-size: 12px; margin-top: 3px; line-height: 1.3; }
        .total-final { font-size: 18px; margin-top: 2px; padding-top: 1px; }

        /* Rodapé mínimo */
        .rodape { font-size: 10px; margin-top: 4px; }
    }
</style>
<base target="_blank">
<base target="_blank">
</head>
<body>

    <div class="ticket">
        <h3>CANTINHO BR</h3>
        <p class="centered num-pedido">PEDIDO #<span id="id-pedido">---</span></p>
        <p class="centered">Tel: +595 982 808985</p>
        <hr>

        <div class="info-group">
            <strong>Data:</strong> <span id="data-hora">---</span><br>
            <strong>Cliente:</strong> <span id="nome">---</span><br>
            <strong>Tel:</strong> <span id="tel">---</span>
        </div>
        <hr>

        <div class="tipo-entrega-tx"><span id="tipo-entrega">---</span></div>
        <div id="endereco-box" style="display:none;">
            Ref: <span id="ref-entrega">---</span>
        </div>
        <hr>

        <table>
            <thead>
                <tr>
                    <th style="width:14%">Qtd</th>
                    <th>Item</th>
                    <th style="text-align:right">Total</th>
                </tr>
            </thead>
            <tbody id="lista-itens">
                <tr><td colspan="3" style="text-align:center;padding:10px;">Carregando...</td></tr>
            </tbody>
        </table>
        <hr>

        <div class="totals">
            Subtotal: <span id="subtotal">Gs 0</span><br>
            Frete: <span id="frete">Gs 0</span><br>
            <div class="total-final">TOTAL: <span id="total-geral">Gs 0</span></div>
        </div>
        <hr>

        <div class="info-group">
            <strong>Pagto:</strong> <span id="forma-pag">---</span>
            <div id="obs-pag"></div>
        </div>

        <div id="box-factura" style="display:none; margin-top:10px; border:1px dashed #000; padding:6px;">
            <strong>DADOS FACTURA:</strong><br>
            RUC: <span id="ruc">---</span><br>
            Razão: <span id="razao">---</span>
        </div>

        <br>
        <p class="rodape">*** OBRIGADO PELA PREFERÊNCIA ***</p>
    </div>

    <button class="btn-print" onclick="window.print()">🖨️ IMPRIMIR PEDIDO</button>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const codigoBase64 = params.get('d');
            
            if(!codigoBase64) {
                document.body.innerHTML = "<h3 style='text-align:center; color:red; margin-top:50px'>Erro: Link inválido ou incompleto.</h3>";
                return;
            }

            try {
                // Decodifica Base64 URL-safe -> JSON
                // Reverte substituições: - volta para +, _ volta para /
                const base64Normal = codigoBase64
                    .replace(/-/g, '+')
                    .replace(/_/g, '/');
                // Adiciona padding = se necessário
                const pad = base64Normal.length % 4;
                const base64Padded = pad ? base64Normal + '='.repeat(4 - pad) : base64Normal;
                
                const jsonString = decodeURIComponent(escape(atob(base64Padded)));
                const pedido = JSON.parse(jsonString);
                
                console.log('Pedido recebido:', pedido);

                // ID DO PEDIDO
                document.getElementById('id-pedido').innerText = pedido.id || 'S/N';

                // 1. Cabeçalho
                document.getElementById('data-hora').innerText = pedido.data || new Date().toLocaleString('pt-BR');
                document.getElementById('nome').innerText = pedido.cliente?.nome || 'Cliente';
                document.getElementById('tel').innerText = pedido.cliente?.tel || 'S/N';

                // 2. Entrega
                const tipoEntrega = pedido.entrega?.tipo || 'delivery';
                document.getElementById('tipo-entrega').innerText = tipoEntrega.toUpperCase();
                
                if(tipoEntrega === 'delivery') {
                    document.getElementById('endereco-box').style.display = 'block';
                    document.getElementById('ref-entrega').innerText = pedido.entrega?.ref || 'Não informado';
                }

                // 3. Itens 
                const tbody = document.getElementById('lista-itens');
                tbody.innerHTML = '';
                
                console.log('🍣 Itens recebidos:', JSON.stringify(pedido.itens));
                
                const itens = Array.isArray(pedido.itens) ? pedido.itens : [];
                if (itens.length > 0) {
                    itens.forEach((item, idx) => {
                        console.log('Item '+idx+':', JSON.stringify(item));
                        const tr = document.createElement('tr');
                        
                        // Extrai quantidade: aceita q, qtd, quantidade — fallback 1
                        const quantidade = (item.q !== undefined ? item.q : null) 
                                        || (item.qtd !== undefined ? item.qtd : null)
                                        || (item.quantidade !== undefined ? item.quantidade : null)
                                        || 1;
                        
                        // Extrai nome
                        // Se o nome for o placeholder genérico de pizza e existir sabor na montagem,
                        // usa o sabor (montagem[0]) como nome principal do item
                        let nomeItem = item.n || item.nome || item.name || ('Item '+(idx+1));
                        const montagemRaw = item.m || item.montagem || [];
                        const primeiroSabor = Array.isArray(montagemRaw) && montagemRaw.length > 0 ? montagemRaw[0] : '';
                        if (/escolha\s+tamanho/i.test(nomeItem) && primeiroSabor) {
                          nomeItem = 'Pizza'; // fallback legível; sabor aparece abaixo em destaque
                        }
                        
                        // Extrai preço — usa parseFloat para garantir número
                        const preco = parseFloat(item.p !== undefined ? item.p : (item.preco !== undefined ? item.preco : (item.valor || 0))) || 0;
                        
                        const montagem = item.m || item.montagem || [];
                        const observacao = item.o || item.obs || item.observacao || '';
                        const tipo = item.t || item.tipo || '';    // variação (ex: "Combo Grande")
                        const preparo = item.pr || item.preparo || ''; // preparo (ex: "Flambado")
                        
                        let detalhes = '';
                        // Mostra variação apenas se for diferente do nome do item (evita duplicação)
                        if (tipo && tipo !== nomeItem && tipo !== 'Padrão' && tipo !== 'Montado') {
                          detalhes += '<br><span class="detalhe-variacao">▸ '+tipo+'</span>';
                        }
                        if (preparo) detalhes += '<br><span class="detalhe-preparo">🍳 '+preparo+'</span>';
                        if (Array.isArray(montagem) && montagem.length > 0) {
                          montagem.forEach(linha => {
                            const colonIdx = linha.indexOf(':');
                            if (colonIdx > 0) {
                              detalhes += '<br><span class="detalhe-montagem"><strong>'+linha.slice(0,colonIdx)+':</strong> '+linha.slice(colonIdx+1).trim()+'</span>';
                            } else {
                              detalhes += '<br><span class="detalhe-montagem">'+linha+'</span>';
                            }
                          });
                        }
                        if (observacao) detalhes += '<br><span class="detalhe-obs">OBS: '+observacao+'</span>';
                        
                        const total = (preco * quantidade).toLocaleString('es-PY');
                        tr.innerHTML = '<td style="vertical-align:top">'+quantidade+'x</td><td>'+nomeItem+detalhes+'</td><td style="text-align:right">Gs '+total+'</td>';
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#e74c3c;">Nenhum item encontrado</td></tr>';
                }

                // 4. Totais
                const valores = pedido.valores || {};
                document.getElementById('subtotal').innerText = `Gs ${(valores.sub || valores.subtotal || 0).toLocaleString('es-PY')}`;
                document.getElementById('frete').innerText = `Gs ${(valores.frete || valores.frete_cobrado_cliente || 0).toLocaleString('es-PY')}`;
                document.getElementById('total-geral').innerText = `Gs ${(valores.total || valores.total_geral || 0).toLocaleString('es-PY')}`;

                // 5. Pagamento
                const pagamento = pedido.pagamento || {};
                const metodoPag = pagamento.metodo || pagamento.forma_pagamento || 'Não informado';
                const obsPagRaw = pagamento.obs   || pagamento.obs_pagamento   || '';

                if (metodoPag === 'Multipagamento') {
                    document.getElementById('forma-pag').innerText = '🔀 Pagamento dividido:';
                    try {
                        const partes = JSON.parse(obsPagRaw);
                        document.getElementById('obs-pag').innerHTML = partes.map((p, i) => {
                            let linha = `${i + 1}. ${p.metodo}: Gs ${parseFloat(p.valor).toLocaleString('es-PY')}`;
                            if (p.troco) linha += ` (Troco p/ ${p.troco})`;
                            return linha;
                        }).join('<br>');
                    } catch(e) {
                        document.getElementById('obs-pag').innerText = obsPagRaw;
                    }
                } else {
                    document.getElementById('forma-pag').innerText = metodoPag;
                    document.getElementById('obs-pag').innerText = obsPagRaw;
                }

                // 6. Factura
                if(pedido.factura && (pedido.factura.ruc || pedido.factura.razao)) {
                    document.getElementById('box-factura').style.display = 'block';
                    document.getElementById('ruc').innerText = pedido.factura.ruc || 'S/N';
                    document.getElementById('razao').innerText = pedido.factura.razao || 'S/N';
                }
                
                setTimeout(() => window.print(), 800);

            } catch (e) {
                console.error('Erro ao processar pedido:', e);
                document.body.innerHTML = `
                    <h3 style='text-align:center; color:red; margin-top:50px'>
                        Erro ao ler o pedido.<br><br>
                        <small>O link pode estar incompleto ou corrompido.</small><br><br>
                        <button onclick="window.close()" style="padding:10px 20px; background:#1a7a2e; color:white; border:none; border-radius:5px; cursor:pointer;">
                            Fechar
                        </button>
                    </h3>
                `;
            }
        }
    </script>
</body>
</html>
